[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serviceflow-itsm"
version = "1.1.0"
description = "Local IT service management and workflow automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<27",
    "fastapi>=0.164,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0.40,<2.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.0,<3", "pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["serviceflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
